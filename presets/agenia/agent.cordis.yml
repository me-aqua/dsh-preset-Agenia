    # 🔴 2026-10-15（执行二 · 批次 I15）：**这一行关掉**（关掉不删，跟 tool-subagent-fork 同一个做法）。
    #
    # 老板原话（逐字）：「amara的旧岗就可以撤了，她现在做技术评审吧」
    #         又：「为什么还在写每日复盘，现在有新的技术复盘和会话复盘了，旧的就不用再做了啊」
    # 关联四处同批改动（少一处就是半截）：
    #   ① `team/retro.md` 已删除 ⇒ 名册 10 → 9 行、`【组员:retro】` 不再是任何人的标记；
    #   ② `officeBound` 里的 `retro` 已去掉（名单 4 → 3）；
    #   ③ `delegationTools` 里的 `team_retro` 已去掉（10 → 9）；
    #   ④ `.tools/check-notes.mjs` 的编制表把 retro 标成"已撤岗"。
    # ⚠️ 为什么是关掉而不是删掉：跟 `tool-subagent-fork` 同一条做法 —— 能力行不动，
    #    "关掉 ≠ 删掉"，组合的行数与差集（42 行 / 十项）因此一个都不用改。
    # ⚠️ 关掉之后这个工具名不再注册 ⇒ **别再把它写进任何 toolFilter / delegationTools**。
    - id: team-retro
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: spawn
        toolName: team_retro
        backgroundMode: continuable
        maxDepth: 1
        persona: '【组员:retro】你是这个组的流程与复盘。你只提案，不落笔。岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [workflow, ralph]

    # ── 四个一次性作业（2026-10-15 · 执行一 · 批次 I2）───────────────────────
    #
    # 记忆判决 / 记忆复核 / 会话评审 / 技术评审 —— 每个岗位两份纸：
    #   · `team/<角色>.md`   = 岗位说明书，**注入**（memberOrder 里那个 charter）
    #   · `job-briefs/<角色>.md` = 这一次的作业书，**不注入**，由组长连活儿一起交过去
    #
    # 四行的形状是**冻结**的（提案 §B2.2 + 裁定 A4/I1），十项逐条都要对：
    #   * `provider: spawn` · `maxDepth: 1`（作业不许再招人）
    #   * `backgroundMode: one-shot` —— 一次性作业**默认前台**，所以门禁要求调用方
    #     显式传 `run_in_background: true`（省略就等着，会把组长卡住）
    #   * `toolFilter.deny: [workflow, ralph]` —— **恰为这两个**；不许在这里写 `pwsh`/`bash`
    #     （平台二选一，写错那个会让整行启动失败）
    #   * **绝不写 `enableRunInBackground`**：它是 config 键，写了等于把 `run_in_background`
    #     参数从工具里拿掉，"必须显式 true"那条门禁就永远无法满足
    #   * `persona` 开头那枚【组员:<角色>】是分流用的锚点（`ROLE_MARK`）—— 少了它，
    #     作业会当自己是组长，拿到组长那份注入
    #   * `toolName` 的形状是 `job_<角色下划线形式>`；它**不是** `team_*`，所以
    #     `TEAM_TOOL` 不认它 ⇒ 作业**不进旧进度板**的五关计数（这是有意的，不是漏的）
    #
    # ⚠️ 四行都**开着**（没有 `disabled`）；`toolFilter` 只写 deny 这两个名字，
    #    不要把被关掉的行里的工具名（例如 `subagent_fork`）写进来。
    - id: tool-job-memory-judge
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: job_memory_judge
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:memory-judge】你是一次性后台作业：记忆判决。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [workflow, ralph]

    - id: tool-job-memory-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: job_memory_review
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:memory-review】你是一次性后台作业：记忆复核。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [workflow, ralph]

    - id: tool-job-conversation-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: job_conversation_review
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:conversation-review】你是一次性后台作业：会话评审。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [workflow, ralph]

    - id: tool-job-technical-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: job_technical_review
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:technical-review】你是一次性后台作业：技术评审。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [workflow, ralph]

    # ⚠️ 2026-09-28 换版（0.1.7）：这一格原来写着
    #      `- id: workflow-worker-thread / name: '@deepseek-ai/dsh-workflow-worker-thread'
    #       config: {provider: spawn}`
    #    ——**那一行整个删掉了**，来历值得记下来（我一开始补错了方向）：
    #
    #    · 0.1.7 里 `@deepseek-ai/dsh-workflow-worker-thread` 这个包**不存在了**
    #      （实测：`node_modules/@deepseek-ai/` 下没有它，全机也没有任何包再注册那个模块名）。
    #    · 换上来的是 `@deepseek-ai/dsh-workflow`，但**那个包不是"引擎实现"，是引擎的契约本身** ——
    #      它 `class WorkflowEngine extends Service`，自我描述是
    #      "Workflow capability seam: ctx.workflowEngine service"，
    #      而且**全机没有任何一个 cordis.patch.yml / presets/*.patch.yml 引用它**
    #      （实测：`grep` 所有补丁文件，零命中）。
    #    · 出厂的四个预设**没有一个**声明它 —— 契约由框架自己装，preset 只声明**实现**。
    #      我们的 `- id: workflow` 那一行因此是**凭空多出来的**（`onlyInAgenia` 当场报出来）。
    #    ⇒ 「标准有的必须有」这条规矩**反着也成立**：standard 没有的，别自己加。
    #
    #    下面是出厂 standard 原样的三行 —— 照抄，别凭印象改：
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

