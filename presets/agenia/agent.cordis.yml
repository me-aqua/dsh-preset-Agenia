# The `agenia` agent preset — the `standard` coding agent, with its own persona.
#
# WHAT THIS FILE IS FOR: Agenia's character. Everything that decides what she
# can DO is copied row-for-row from the shipped `standard` composition and is
# meant to stay identical to it, so that picking "Agenia 模式" changes only who
# is talking, never what the agent is able to do. Everything else belongs to
# `standard`; read that file for the reasoning behind the copied rows.
#
# EXACTLY TWO ROWS ARE THIS PRESET'S OWN:
#
#   * `persona` — shadows the deployment persona and carries the guard marker.
#   * `persona-injector` — reads `../persona.md` on every model step and
#     contributes it at the END of the request. This is what makes the persona
#     live rather than baked in: editing the markdown changes the next step of
#     a running session, with no restart.
#
# Every other row must match `standard`. When `standard` changes, change the
# rows here to match — the capability half of this file is a copy, not an
# opinion. The comments explaining WHY each copied row sits where it does are
# deliberately NOT repeated here, because a second copy of an explanation
# drifts from the first.
#
# ── the rules that still apply to the copied rows ───────────────────────────
#
# AGENT PLANE. The roster mounts this once per process under a standing scope;
# each session naming it joins by scope parentage. The host composition
# (`base.cordis.yml` + `web.cordis.yml`) keeps everything a preset must not own:
# the registries, the sandbox and approval stack, persistence, the model route.
#
# REALMS. A row that PUBLISHES a service must sit inside a group carrying an
# `isolate` realm, or it lands in the process-global root realm and the mount is
# rejected. `true` means an entry-local realm — this mount's own private
# instance. A shared label does NOT pool instances. The three groups below
# (`planning`, `compaction`, `delegation`) are exactly `standard`'s, and every
# consumer that reaches a service they publish must live inside them.
#
# REQUIRED CONFIG. A key declared `z.boolean().required()` has no default and
# sinks the WHOLE mount when omitted: `tool-todo.allowParallelInProgress` and
# `tool-fs-search.sampleOverCapGlobResults` are both spelled out below for that
# reason. Keys declared `.default(...)` may be omitted.
#
# VERIFY BY MOUNTING. `agentPresets.standingKeyFor('agenia')` must answer
# `MOUNT OK: agenia`. A file that parses is not a file that mounts. Mounting is
# NOT sufficient either — this preset's injector fails at REQUEST time, not load
# time, so a change here also needs one real turn to prove it.
#
# NO PERSONA CONTENT IN THIS FILE. This composition is static, so anything about
# who Agenia is would live in two places the moment `persona.md` also states it,
# and the two drift. Her name, age and voice belong in `persona.md` alone. The
# `persona` row below is deliberately name-free: it exists to shadow the
# deployment persona and nothing else. Renaming her is a one-file edit.
# (`preset.yml` still carries a display name — that is the roster's picker
# label, which cannot come from the markdown.)

# ── identity ────────────────────────────────────────────────────────────────

# The persona baseline. It carries NO persona content: it exists only so the
# deployment's generic persona ("You are a coding agent powered by the
# {{model}} model") is shadowed for sessions on this preset. The real persona
# arrives every turn from `../persona.md` via the row below.
#
# Nothing here is load-bearing for that mechanism — the injector keys off SCOPE,
# not off any text — so this row is freely editable, and so is the markdown.
#
# Keep `complete` OUT of this config. With it, this row becomes the SOLE prompt
# section and the project's own `AGENTS.md` stops reaching the model.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 你在 {{cwd}} 干活。
    prefix: |-
      你的身份、年龄和讲话风格见每轮注入的运行时上下文。

      （Who you are is defined in the runtime context injected for every turn.
      Follow it exactly; it is your persona, not background information.）

# ── the persona, read fresh every turn ──────────────────────────────────────

# Loads `../persona.md` on every model step and contributes it as a per-turn
# prompt CONTEXT, so the persona lands at the end of the request and editing
# the markdown takes effect on the next step of a RUNNING session.
#
# This is one of the two non-standard rows in this file. The other is `persona`
# above; everything else must match `standard`.
#
# A relative `name` resolves against THIS preset's own directory (the roster
# classifies `./`-prefixed rows as preset-local), which is what makes the
# plugin and the markdown travel together with the preset.
#
# The plugin decides which assemblies are its own by SCOPE, not by any string
# in the files above, so neither this composition nor `persona.md` has to
# contain anything in particular for injection to keep working.
#
# The plugin directory ships a `package.json` because the host's package
# inventory resolves every active row's owning manifest on each request. That
# manifest MUST carry both `name` AND `version`: a manifest that has a `name`
# but no `version` makes the inventory throw, which surfaces as a confusing
# `REQUEST_EXTENSION` request failure rather than a load error. This cost a
# debugging session — see AGENTS.md.
# The `?v=` query is load-bearing and must NOT be removed. ES modules are cached
# by URL, and a FAILED import is cached as failed against that URL too — with a
# bare './persona-plugin/inject.js' this row kept reusing a module instance that
# had been imported while the file was briefly broken, so the persona silently
# stopped being injected while `MOUNT OK` and `fiber=2` both still looked fine.
# Bumping the query forces a fresh URL. See AGENTS.md section 3e.
- id: persona-injector
  name: './persona-plugin/inject.js?v=3'

# Loads `AGENTS.md` / `AGENTS.local.md` from the project root down to the
# session working directory. It does NOT compete with the persona above: these
# arrive as a `user/message`, not as a prompt section.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Not installed in production dsh: enable only after adding the matching
    # Bundle to the Profile and restarting the Host.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
