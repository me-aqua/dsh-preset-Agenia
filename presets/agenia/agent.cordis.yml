      config:
        provider: spawn
        toolName: team_design
        backgroundMode: continuable
        maxDepth: 1
        persona: '【组员:design】你是这个项目的设计和美工。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [workflow, ralph]

