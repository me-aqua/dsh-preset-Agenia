# The `agenia` agent preset — the `standard` coding agent, with its own persona.
#
# WHAT THIS FILE IS FOR: Agenia's character. Everything that decides what she
# can DO is copied row-for-row from the shipped `standard` composition and is
# meant to stay identical to it, so that picking "Agenia 模式" changes only who
# is talking, never what the agent is able to do. Everything else belongs to
# `standard`; read that file for the reasoning behind the copied rows.
#
# EIGHT ROWS (AND ONE KEY) ARE THIS PRESET'S OWN:
#
#   * `persona` — shadows the deployment persona. Carries NO persona content.
#   * `persona-injector` — reads the preset's markdown on every model step and
#     contributes it at the END of the request, so editing a file changes the
#     next step of a RUNNING session. It serves TWO audiences — the group leader
#     and every team member — and tells them apart by a role marker; read that
#     file before changing it.
#   * `team-product` / `team-dev` / `team-test` / `team-review` / `team-retro` —
#     the five permanent roles. Each starts a fresh child that receives its own
#     charter and a structural tool boundary.
#   * the `persona` key on the `subagent` row — marks every spawn child as a
#     TEMP HIRE instead of as the leader.
#
# Every other row must match `standard`; when `standard` changes, change the
# rows here to match. The capability half of this file is a copy, not an
# opinion. The comments explaining WHY each copied row sits where it does are
# deliberately NOT repeated here, because a second copy of an explanation
# drifts from the first.
#
# THE PARITY RULE, AMENDED. This file used to promise that the capability half
# was IDENTICAL to `standard`. It is not, deliberately: the team rows are an
# addition. Verify the relation as a SET difference rather than by eye —
# mount-validate with `standingKeyFor('agenia')`, then compare
# `compositionInventory()` buckets by `moduleName + enabled + condition`:
# `onlyInStandard` must be empty, and `onlyInAgenia` must contain exactly the
# rows listed above (the injector row, plus five MORE instances of
# `@deepseek-ai/dsh-tool-subagent`). Compare it as a MULTISET: the five team
# rows share one module name, so a set comparison silently misses them.
#
# ── the rules that still apply to the copied rows ───────────────────────────
#
# AGENT PLANE. The roster mounts this once per process under a standing scope;
# each session naming it joins by scope parentage. The host composition
# (`base.cordis.yml` + `web.cordis.yml`) keeps everything a preset must not own:
# the registries, the sandbox and approval stack, persistence, the model route.
#
# REALMS. A row that PUBLISHES a service must sit inside a group carrying an
# `isolate` realm, or it lands in the process-global root realm and the mount is
# rejected. `true` means an entry-local realm — this mount's own private
# instance. A shared label does NOT pool instances. The three groups below
# (`planning`, `compaction`, `delegation`) are exactly `standard`'s, and every
# consumer that reaches a service they publish must live inside them.
#
# REQUIRED CONFIG. A key declared `z.boolean().required()` has no default and
# sinks the WHOLE mount when omitted: `tool-todo.allowParallelInProgress` and
# `tool-fs-search.sampleOverCapGlobResults` are both spelled out below for that
# reason. Keys declared `.default(...)` may be omitted.
#
# VERIFY BY MOUNTING. `agentPresets.standingKeyFor('agenia')` must answer
# `MOUNT OK: agenia`. A file that parses is not a file that mounts. Mounting is
# NOT sufficient either — this preset's injector fails at REQUEST time, not load
# time, so a change here also needs one real turn to prove it.
#
# NO PERSONA CONTENT IN THIS FILE. This composition is static, so anything about
# who Agenia is would live in two places the moment `persona.md` also states it,
# and the two drift. Her name, age and voice belong in `persona.md` alone. The
# `persona` row below is deliberately name-free: it exists to shadow the
# deployment persona and nothing else. Renaming her is a one-file edit.
# (`preset.yml` still carries a display name — that is the roster's picker
# label, which cannot come from the markdown.)

# ── identity ────────────────────────────────────────────────────────────────

# The persona baseline. It carries NO persona content: it exists only so the
# deployment's generic persona ("You are a coding agent powered by the
# {{model}} model") is shadowed for sessions on this preset. The real persona
# arrives every turn from `../persona.md` via the row below.
#
# Nothing here is load-bearing for that mechanism — the injector keys off SCOPE,
# not off any text — so this row is freely editable, and so is the markdown.
#
# Keep `complete` OUT of this config. With it, this row becomes the SOLE prompt
# section and the project's own `AGENTS.md` stops reaching the model.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 你在 {{cwd}} 干活。
    prefix: |-
      你的身份、年龄和讲话风格见每轮注入的运行时上下文。

      （Who you are is defined in the runtime context injected for every turn.
      Follow it exactly; it is your persona, not background information.）

# ── the persona, read fresh every turn ──────────────────────────────────────

# Loads `../persona.md` on every model step and contributes it as a per-turn
# prompt CONTEXT, so the persona lands at the end of the request and editing
# the markdown takes effect on the next step of a RUNNING session.
#
# This is one of the two non-standard rows in this file. The other is `persona`
# above; everything else must match `standard`.
#
# THE CODE TRAVELS WITH THIS DIRECTORY. The `name` below is a relative path,
# and a relative row specifier is resolved against the directory of the
# composition that declares the row — this preset's own directory, wherever
# that directory has been copied to. So the plugin file needs nothing installed
# anywhere, and the markdown stays next to it: `contentDir: '.'` resolves
# against the same base, which is what keeps `persona.md` and `leader.md`
# editable on disk. A BARE package name would be resolved from the harness's
# own base instead — the profile directory — so it would depend on whatever is
# installed there. Neither form is resolved against the process working
# directory.
#
# The plugin decides which assemblies are its own by SCOPE, not by any string
# in the files above, so neither this composition nor `persona.md` has to
# contain anything in particular for injection to keep working.
#
# The plugin directory's `package.json` MUST carry both `name` AND `version`
# because the host's package inventory resolves every active row's owning
# manifest on each request. A manifest that has a `name` but no `version` makes
# the inventory throw, which surfaces as a confusing `REQUEST_EXTENSION`
# request failure rather than a load error.
#
# ES modules are cached by URL, and a FAILED import is cached as failed against
# that URL too, so this row can keep reusing a module instance that was imported
# while the plugin file was broken — the persona then stops being injected while
# `MOUNT OK` and `fiber=2` both still look fine. Editing the plugin therefore
# needs a harness RESTART, and a restart is the only thing that works: the
# `name` below is a file path, with no version and no query string in it, so
# nothing written into `package.json` changes the URL the module was cached
# under and the cached instance is reused. The markdown stays live either way:
# it is read from disk on every step.
- id: persona-injector
  name: './persona-plugin/inject.js'
  config:
    contentDir: '.'

# Loads `AGENTS.md` / `AGENTS.local.md` from the project root down to the
# session working directory. It does NOT compete with the persona above: these
# arrive as a `user/message`, not as a prompt section.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # The `subagent` tool is this group's TEMP-HIRE channel: the leader writes a
    # job description and starts a one-off specialist. The `persona` below is
    # load-bearing — it carries the role marker the injector keys off
    # (`persona-plugin/inject.js`), and WITHOUT it a spawned child is handed the
    # leader's own persona and believes it is her. The hire's full charter is
    # injected from `team/hire.md` on every request.
    #
    # `subagent_fork` below is deliberately NOT marked: a fork continues this
    # agent's own conversation prefix, so it should keep this agent's identity.
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        persona: |-
          【组员:hire】你是这个组临时外聘的专家，干完就走。
          这个组的来龙去脉、工序、以及你的岗位说明书会随请求自动注入 —— 开工前先读它们。

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Not installed in production dsh: enable only after adding the matching
    # Bundle to the Profile and restarting the Host.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    # ── 固定组员 ─────────────────────────────────────────────────────────────
    #
    # One row per permanent role. The leader calls these by name; each starts a
    # fresh child that shares no context with her, which is exactly what the
    # process needs at the independent stages (a reviewer who never saw the
    # implementation cannot rubber-stamp it).
    #
    # `persona` carries the role marker the injector keys off — see
    # `persona-plugin/inject.js`. It is what makes a child receive ITS OWN
    # charter instead of the leader's persona. The marker is a machine token in
    # OUR composition, never in the operator's markdown, so editing a charter
    # stays a plain file edit.
    #
    # The charter itself is NOT copied here: the injector reads `team/<role>.md`
    # fresh on every request, so editing one takes effect on the next step of a
    # running session.
    #
    # `maxDepth: 1` is the structural cap that stops a member from hiring
    # anybody: a member sits at depth 1, so its own child would be depth 2 and
    # is rejected at start. It is the load-bearing guard, and it cannot fail on
    # a name.
    #
    # `toolFilter` additionally takes the delegation tools out of its prompt, so
    # they cannot even be attempted. It is prompt hygiene on top of that guard —
    # and it is the part that can fail LOUDLY at child start.
    #
    # ⚠️ ONLY NAMES THE CHILD *INHERITS* MAY APPEAR IN A DENY LIST.
    # `restrict()` rejects a "scope-local" name, i.e. one registered in the
    # child's OWN layer, and the failure aborts the whole child start:
    #
    #     tools.restrict() names unknown global tool "subagent"
    #
    # That is exactly what happened here: the `subagent` row above sets
    # `modelSelectionSettings`, so that instance installs its tool per-Agent
    # through each Session's own Context rather than into the standing layer —
    # the sibling `subagent_fork` row, which omits model selection, stays
    # inherited and IS restrictable. This cost one full verification run; the
    # error message helpfully prints the complete restrictable universe, so read
    # it rather than guessing a name.
    #
    # `modelSelectionSettings` is deliberately ABSENT from every row below: at
    # most one instance per tool scope may own model selection
    # (`list_subagent_models` is a global name), and the `subagent` row owns it.

    - id: team-product
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: team_product
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:product】你是这个项目的产品和体验负责人。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [subagent_fork, workflow, ralph]

    - id: team-dev
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: team_dev
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:dev】你是这个项目的实现者。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [subagent_fork, workflow, ralph]

    - id: team-test
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: team_test
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:test】你是这个项目的测试与流水线负责人。你的岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [subagent_fork, workflow, ralph]

    - id: team-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: team_review
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:review】你是这个项目的独立评审。你只审不改。岗位说明书会随请求自动注入 —— 开工前先读它。'
        # 写权限边界**不在这里** —— 它由 `persona-plugin/inject.js` 的角色门禁统一执行：
        # 产品 / 审核 / 流程三个角色同一套规则（只能写 `.team/` 下、且没有 shell）。
        # **一行一条规则，规则只有一个家。** 这里的 deny 只管"不许再招人"。
        toolFilter:
          deny: [subagent_fork, workflow, ralph]

    - id: team-retro
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: team_retro
        backgroundMode: one-shot
        maxDepth: 1
        persona: '【组员:retro】你是这个组的流程与复盘。你只提案，不落笔。岗位说明书会随请求自动注入 —— 开工前先读它。'
        toolFilter:
          deny: [subagent_fork, workflow, ralph]

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
