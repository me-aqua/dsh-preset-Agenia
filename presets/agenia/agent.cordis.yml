    #
    #    · 0.1.7 里 `@deepseek-ai/dsh-workflow-worker-thread` 这个包**不存在了**
    #      （实测：`node_modules/@deepseek-ai/` 下没有它，全机也没有任何包再注册那个模块名）。
    #    · 换上来的是 `@deepseek-ai/dsh-workflow`，但**那个包不是"引擎实现"，是引擎的契约本身** ——
    #      它 `class WorkflowEngine extends Service`，自我描述是
