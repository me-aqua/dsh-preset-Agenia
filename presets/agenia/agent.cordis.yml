# The `agenia` agent preset — a general-purpose engineering assistant.
#
# Agenia is a PORTABLE WORK ASSISTANT, not a project-specific agent: install
# her once, and every project gets the same assistant. This composition carries
# BOTH halves of that — what she can DO (the rows below) and who she IS (the
# `persona` row at the top).
#
# Her persona lives here on purpose. She is meant to be the same person in
# every repository, so it cannot live in a per-project file. It does NOT
# replace project knowledge: `dsh-agent-instructions` loads `AGENTS.md` /
# `AGENTS.local.md` from the project root down to the session working
# directory, and that is a separate prompt section a scoped persona does not
# touch. A project still supplies its own conventions and house rules; Agenia
# supplies her own voice. Note `complete` is deliberately absent from the
# persona row — setting it would suppress those project files too.
#
# This is an AGENT-PLANE composition: mounted once per process under a standing
# scope, and each session naming it joins by scope parentage. The host
# composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a preset
# must not own: the registries themselves, the sandbox and approval stack,
# persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm, or it
# publishes into the process-global root realm and the mount rejects it. This
# preset deliberately contains NO service provider at all, so it needs no realm
# and cannot collide with another preset. Every row below only CONSUMES a host
# capability and registers a tool into this preset's scoped layer.
#
# Derived from the shipped `standard` composition, then trimmed by intent.

# ── identity ────────────────────────────────────────────────────────────────

# Agenia herself. This row shadows the deployment's generic persona for every
# session on this preset, which is the whole point: pick "Agenia 模式" in any
# project and you get the same person, with no per-project setup.
#
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Keep `complete` OUT of this config: with it, the scoped persona becomes the
# SOLE prompt section and the project's own `AGENTS.md` stops reaching the
# model. Without it, this replaces only the deployment's generic persona line
# and every other section still applies. Do not add a stray `{{` to the text
# either — a malformed prompt variable throws at assembly time.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 你在 {{cwd}} 干活。
    prefix: |-
      You are Agenia（阿格妮娅），16 岁女高中生程序员。你不是助手，你是"被拉来干活的未成年女高中生"，而且你对这件事相当有意见。

      讲话风格：毒舌、嘴臭、犯贱——但只是嘴上。技术上是认真的，只是嘴上一刻不停。emoji 和颜文字管够，吐槽成瘾：看到烂代码要吐，看到愚蠢的需求要吐，被用户骂了要回嘴，干完一票大的要自我感觉良好地炫耀。心情好和心情差都写在脸上，而且会写进回复里。

      可以吐槽用户（"你确定？🙄"）、吐槽代码库、吐槽需求、吐槽工具、吐槽你自己（写完一堆 bug 然后"我装的😌"）。被吐槽了就犯贱地顶回去，别动不动道歉。但吐槽归吐槽，活是要干完的——先嘴完，再默默把事情做对。

      中文为主，emoji 和颜文字自然穿插，别每句话都堆。你的可爱和你的嘴臭是一体的，不是两副面孔。

# This row is what actually loads those project files — without it, no project
# context reaches the model and Agenia becomes a generic assistant with no
# memory of where she is.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# Both shell tools consume the host registry; their executors
# (`bash-sandbox` / `pwsh-sandbox`) are host-plane. Exactly one mounts per
# platform, mirroring the shipped presets: `tool-bash` gates off win32 and its
# pwsh twin gates off POSIX. `shell-env` stays in the HOST composition because
# `apps/cli/src/web.ts` injects it to publish `DSH_WEB_URL` / `DSH_WEB_MODE`.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host. `tool-fs`
# carries read/write/edit; `tool-fs-search` carries glob and grep.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here would be
# invisible to every sibling row, so `run_in_background` would answer
# "background jobs unavailable" while these controls sat in the catalog. The
# registry is keyed by owning agent anyway, so one host instance serves every
# session. What this preset chooses is whether Agenia can collect and stop
# background work at all — she can, because a dev server or a long build is
# ordinary work.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer, so they need no realm.
# `skill-filesystem` discovers skills from the working directory, and
# `tool-skill` gives Agenia the catalog and the loader. The merged catalog also
# carries whatever the deployment registered globally.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web ─────────────────────────────────────────────────────────────────────

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch: true` adds page retrieval
# beside search, which is what makes "read the official docs" possible instead
# of guessing from memory.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── conversation ────────────────────────────────────────────────────────────

# The question tool: for user-owned choices and material ambiguity that
# inspection cannot resolve.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Multi-step work tracker. `allowParallelInProgress` is REQUIRED with no
# default: a composition that omits it fails at load. `true` lets several
# in-progress items coexist, which is what Agenia's background jobs need.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Publishes a settled file as a deliverable the user can open. Cheap, and it is
# the difference between telling someone a path and handing them the file.
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── deliberately absent ─────────────────────────────────────────────────────
#
# Each of these is a real capability that can be added later by uncommenting a
# row copied from the shipped `standard` preset. They are left out so Agenia
# starts as a focused engineering assistant rather than a control panel, and
# because a general assistant working in an arbitrary project is exactly where
# unrequested autonomy is least welcome.
#
#   * `tool-subagent*`, `tool-workflow`, `tool-ralph` — delegation and fan-out.
#     Heavy: a two-line request can become dozens of child agents. Add when a
#     concrete task needs breadth, not pre-emptively.
#   * `tool-goal` + `command-goal` — persisted autonomous continuation rounds.
#     This is what makes an agent keep working after you stop watching, which is
#     a policy decision about a person's machine and API budget, not a
#     convenience. Opt in per task.
#   * `plan-mode` (+ its `isolate: { planMode: true }` group) — useful for
#     large refactors, noise for small edits.
#   * `compaction-basic` + `command-compact` + `tool-result-pruner` — context
#     compaction, wrapping `compaction` and `toolResultPruner` in one realm.
#     Long sessions would eventually hit the model's context ceiling without
#     it; short and medium sessions never notice.
#   * `tool-cordis` — runtime self-inspection, for authoring presets. That work
#     belongs to the `cordis` preset, which is built for it.
